<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>主机操作成功</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .header { background-color: #28a745; color: white; padding: 15px; border-radius: 5px 5px 0 0; text-align: center; }
        .content { padding: 20px; background-color: #f9f9f9; }
        .info-row { margin: 10px 0; padding: 10px; background-color: white; border-left: 4px solid #28a745; }
        .label { font-weight: bold; color: #555; display: inline-block; width: 100px; }
        .value { color: #333; }
        .footer { text-align: center; padding: 15px; color: #666; font-size: 12px; }
        .icon { font-size: 48px; text-align: center; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>✓ 主机操作成功</h2>
        </div>
        <div class="content">
            <div class="icon">✅</div>

            <div class="info-row">
                <span class="label">主机名称：</span>
                <span class="value">{{ host_name }}</span>
            </div>
            <div class="info-row">
                <span class="label">操作类型：</span>
                <span class="value">{{ operation }}</span>
            </div>
            {% if operator_name %}
            <div class="info-row">
                <span class="label">操作人员：</span>
                <span class="value">{{ operator_name }}</span>
            </div>
            {% endif %}

            <p style="margin-top: 20px; padding: 15px; background-color: #d4edda; border: 1px solid #c3e6cb; border-radius: 5px; color: #155724;">
                主机操作已成功完成，所有相关配置已更新。
            </p>
        </div>
        <div class="footer">
            此消息由虚拟化中心自动发送
        </div>
    </div>
</body>
</html>
